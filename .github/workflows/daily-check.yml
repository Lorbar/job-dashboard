name: Daily job link check
on:
  schedule: [{cron: "0 14 * * *"}]   # 14:00 UTC ≈ 7:00 AM Pacific (6:00 AM in winter)
  workflow_dispatch: {}
  push: {branches: [main], paths: ["index.html","scripts/**"]}
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
      - name: Commit status
        run: |
          git config user.name "job-checker"; git config user.email "actions@users.noreply.github.com"
          git add status.json; git diff --cached --quiet || git commit -m "Daily status update" && git push
