<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobi's Job Command Center</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#23211c;--mut:#6b665b;--line:#e7e1d2;--brand:#2a4fd0;--good:#12805c;--mid:#b7791f;--low:#b4432f;--chip:#f0ebde}

*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 24px 8px;max-width:1200px;margin:auto}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1200px;margin:auto;padding:8px 24px 60px}

.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 16px}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{min-width:220px;flex:1}button{cursor:pointer}button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h3{margin:0;font-size:16px;line-height:1.3}

.s-hi{background:#dff5ec;color:#0c6a4b}.s-md{background:#fdf0d5;color:#8a5a0b}.s-lo{background:#fbe3dd;color:#963520}
:root[data-theme=dark] .s-hi{background:#12382d;color:#7de6bd}:root[data-theme=dark] .s-md{background:#3a2f12;color:#f3c778}:root[data-theme=dark] .s-lo{background:#40201a;color:#ffab98}

.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand)}
.why{font-size:13.5px}.why b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;align-items:center}
a.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:8px;color:var(--brand);font-size:13px;background:var(--card)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(780px,94vw);max-height:90vh;padding:0}dialog::backdrop{background:#0008}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--card)}
.db{padding:16px 20px;display:grid;gap:14px}.db h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}

@media print{.tabs,.bar,header p,.banner,button{display:none!important}}

.theme{margin-left:auto;display:flex;gap:4px}.theme button{padding:5px 10px;border-radius:999px;font-size:13px}.theme button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

<section id="v-gaps" class="hide"><div id="gaps"></div></section>

<section id="v-resume" class="hide"><div id="resumes"></div></section>

<section id="v-plan" class="hide"><div id="plan"></div></section>

<section id="v-tools" class="hide"><div id="tools"></div></section>
</main>

<dialog id="dlg"><div class="dh"><div><b id="dT"></b><div class="co" id="dC"></div></div><button onclick="dlg.close()">Close ✕</button></div><div class="db" id="dB"></div></dialog>

let FEED={checkedAt:null,roles:{},added:[],log:[]};
const stat=r=>FEED.roles[r.id]||{state:"unknown"};
function liveTxt(r){const x=stat(r);const when=x.checked?` · ${x.checked.slice(0,10)}`:"";return x.state==="live"?`<span class="chip live">✅ Live${when}</span>`:x.state==="closed"?`<span class="chip dead">❌ Appears closed${when}</span>`:`<span class="chip unk">❔ Not auto-verifiable${when}</span>`}
async function loadFeed(){try{const r=await fetch("status.json?"+Date.now());if(!r.ok)throw 0;FEED=await r.json();FEED.added.forEach(a=>{if(!ROLES.find(x=>x.id===a.id))ROLES.push(a)});
 const n=Object.values(FEED.roles).filter(x=>x.state==="closed").length;
 $("stale").innerHTML=`🔄 Auto-checked <b>${(FEED.checkedAt||"").slice(0,16).replace("T"," ")} UTC</b> — ${Object.values(FEED.roles).filter(x=>x.state==="live").length} confirmed live, ${n} appear closed, rest can't be auto-verified (JS-only sites).`+(FEED.log&&FEED.log.length?`<br><small>${FEED.log.slice(0,4).map(esc).join("<br>")}</small>`:"")}catch(e){}render()}
const age=Math.floor((new Date()-new Date(AS_OF))/864e5);
$("stale").innerHTML=age>7?`⚠️ <b>Job data is ${age} days old</b> (checked ${AS_OF}). Postings close quickly — click <b>Verify ↗</b> before applying. Links marked low "verified" confidence couldn't be opened by me (JS-only career sites).`:`Job data checked ${AS_OF}.`;

function card(r){const s=score(r),[c,l]=band(s),x=st(r.id);return `<div class="card ${stat(r).state==="closed"?"closed":""}">
<div class="top"><div><h3>${esc(r.title)}</h3><div class="co">${esc(r.co)} · ${esc(r.loc)}</div></div><div class="score ${c}">${s}<small>${l}</small></div></div>
<div class="meter"><i style="width:${s}%"></i></div>
<div class="chips"><span class="chip">${r.tier} fit</span><span class="chip">${r.bay?"Bay Area":"Relocation / intl"}</span>${liveTxt(r)}<span class="chip">${x.status}</span>${closeTxt(r)}</div>
<div class="why"><b>Why:</b> ${esc(r.why[0])}</div><div class="why"><b>Watch:</b> ${esc(r.risks[0])}</div>
<div class="row"><button class="pri" onclick="openR('${r.id}')">Details &amp; plan</button><a class="btn" target="_blank" rel="noopener" href="${r.url}">Verify ↗</a></div></div>`}
function filtered(){const q=$("q").value.toLowerCase(),t=$("fTier").value,l=$("fLoc").value,s=$("fStat").value;let a=ROLES.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!t||r.tier===t)&&(!l||(l==="bay")===r.bay)&&(!s||st(r.id).status===s));const so=$("sort").value;a.sort((x,y)=>so==="company"?x.co.localeCompare(y.co):so==="conf"?y.f.conf-x.f.conf:so==="close"?(closeOf(x)||"9999").localeCompare(closeOf(y)||"9999"):score(y)-score(x));return a}
function render(){const a=filtered();$("grid").innerHTML=a.map(card).join("")||'<p class="note">No matches for these filters.</p>';
 const all=ROLES.map(score),applied=ROLES.filter(r=>["Applied","Screening","Interview","Offer"].includes(st(r.id).status)).length;
 $("kpis").innerHTML=[[ROLES.length,"roles tracked"],[ROLES.filter(r=>score(r)>=70).length,"higher-odds (≥70)"],[ROLES.filter(r=>r.bay).length,"Bay Area"],[applied,"in play"],[ROLES.filter(r=>closeOf(r)&&days(closeOf(r))>=0&&days(closeOf(r))<=7).length,"closing ≤7 days"],[Math.max(...all),"top fit score"]].map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("")}

function openR(id){const r=ROLES.find(x=>x.id===id),x=st(id),s=score(r),[c,l]=band(s);
$("dT").textContent=r.title;$("dC").textContent=`${r.co} · ${r.loc}`;
$("dB").innerHTML=`<div><div class="score ${c}" style="display:inline-block;padding:6px 14px">${s} · ${l}</div> <span class="note">Fit score = weighted match of the five factors below (my estimate, not a probability of an offer). Adjust weights in Tools.</span></div>
<div><h4>Score breakdown</h4>${Object.keys(FACLAB).map(k=>`<div class="fac"><span>${FACLAB[k]}</span><div class="meter"><i style="width:${r.f[k]*20}%"></i></div><b>${r.f[k]}</b></div>`).join("")}</div>
<div><h4>Why you could land it</h4><ul>${r.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
<div><h4>What could sink it</h4><ul>${r.risks.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
<div><h4>Gaps to address</h4><div class="chips">${r.gapTags.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div></div>
<div><h4>How to raise your odds</h4><ul>${r.act.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
<div><h4>Application checklist</h4>${CHECK.map((t,i)=>`<label style="display:block"><input type="checkbox" ${x.check.includes(i)?"checked":""} onchange="chk('${id}',${i},this.checked)"> ${esc(t)}</label>`).join("")}</div>
<div class="row"><select onchange="setS('${id}',this.value)">${STATUSES.map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select>
<label>Closes <input type="date" value="${closeOf(r)}" onchange="S.roles['${id}'].close=this.value;save();render()"></label>
<label>Follow-up <input type="date" value="${x.follow}" onchange="S.roles['${id}'].follow=this.value;save()"></label>
<a class="btn" target="_blank" rel="noopener" href="${r.url}">Open posting ↗</a><a class="btn" href="resumes/${r.resume}" download>Best resume ⬇</a></div>
<div><h4>Notes (contacts, referral, interview feedback)</h4><textarea rows="4" style="width:100%" oninput="S.roles['${id}'].notes=this.value;save()">${esc(x.notes)}</textarea></div>`;dlg.showModal()}
function chk(id,i,on){const a=st(id).check;const j=a.indexOf(i);if(on&&j<0)a.push(i);if(!on&&j>=0)a.splice(j,1);save()}
function setS(id,v){st(id).status=v;save();render();pipe()}

function pipe(){$("pipe").innerHTML=STATUSES.map(s=>`<div class="col"><h5>${s}</h5>${ROLES.filter(r=>st(r.id).status===s).map(r=>`<div class="mini" onclick="openR('${r.id}')"><b>${esc(r.co)}</b><br>${esc(r.title.slice(0,42))}${st(r.id).follow?`<br><span class="note">follow-up ${st(r.id).follow}</span>`:""}</div>`).join("")}</div>`).join("")}

function gaps(){const m={};ROLES.forEach(r=>r.gapTags.forEach(g=>(m[g]=m[g]||[]).push(r)));const a=Object.entries(m).sort((x,y)=>y[1].length-x[1].length);
$("gaps").innerHTML=`<p class="note">Gaps that recur across your target roles — closing the top ones lifts the most scores. Only learn what's true to claim; add to the resume once you have real proof (a lab, a project, a cert).</p><table><tr><th>Gap</th><th>Roles affected</th><th>How to close it</th></tr>${a.map(([g,rs])=>`<tr><td><b>${esc(g)}</b></td><td>${rs.length}: ${rs.map(r=>esc(r.co)).join(", ")}</td><td>${esc(FIX[g]||"Search the JD wording and build a small, demonstrable example.")}</td></tr>`).join("")}</table>`}
const FIX={"RF lab instrumentation":"If you've used spectrum analyzers/VNAs/chambers at NETGEAR, add them (true ones only). Otherwise a home-lab SDR/NanoVNA project gives honest talking points.","RF lab instrumentation (VNA, IQxel)":"Same — list actual instruments you've used; learn S-parameters and VNA basics.","SerDes / high-speed interfaces":"Study SerDes/PCIe link training, equalization and BER; Keysight/Teledyne intro courses.","Signal integrity (BER, eye, link training)":"Eye-diagram and jitter fundamentals; one-page explainer you could discuss in an interview.","Wi-Fi PHY/MAC test development":"Document a test plan you authored; write a Scapy script that exercises a specific 802.11 behavior.","Test automation frameworks":"Publish a small Python test harness (pytest + Scapy) to GitHub.","Wi-Fi PHY/MAC depth":"802.11ax/be deep-dive (OFDMA, MU-MIMO, roaming 802.11k/v/r)."};

function resumes(){$("resumes").innerHTML=`<p class="note">Two reviewed-for-honesty variants. Edit freely — they're .docx. Rule of thumb: change ≤5 bullets per application and mirror the posting's wording only where it's true.</p><div class="grid">
<div class="card"><h3>Wi-Fi / RF Validation &amp; Escalation</h3><div class="note">For Apple, Google, Meta, Marvell, Qualcomm, Broadcom, eero, Tesla</div><div class="why">Leads with Wi-Fi validation + customer escalation + chip-vendor debug. Keeps wireless as the headline.</div><div class="row"><a class="btn" href="resumes/Tobi_Ajao_Resume_WiFi_Validation.docx" download>Download .docx</a></div></div>
<div class="card"><h3>Customer-Facing Platform Debug (MediaTek-tailored)</h3><div class="note">For MediaTek, Cisco, NVIDIA, general FAE/apps roles</div><div class="why">Reframes your work as platform bring-up, HW/FW/SW root-cause and tooling. Deliberately does <b>not</b> claim SerDes, PCIe, HBM or UCIe experience.</div><div class="row"><a class="btn" href="resumes/Tobi_Ajao_Resume_MediaTek_SystemAppEngineer.docx" download>Download .docx</a></div></div></div>
<h3>Bullet-strengthening prompts (answer with real numbers)</h3><ul><li>Orbi 3/7 chip-vendor testing: how many defects, what severity, what launch risk avoided?</li><li>AI triage tool: how many reviews/tickets classified, accuracy vs. manual, hours saved, who uses it?</li><li>CAX30 field crisis: units debugged, cost/return-rate impact, time to fix.</li><li>Carrier acceptance: pass rate, issues found per SKU, certification timelines hit.</li></ul>
<h3>Interview story bank (STAR)</h3><ul><li><b>CAX30/Comcast:</b> 200+ returned units → hardware flaw → verified fix.</li><li><b>CAX80 telnet exposure:</b> found a security issue across tens of thousands of units.</li><li><b>Claude triage tool:</b> from idea to production adoption.</li><li><b>Orbi 3/7 pre-launch defects:</b> working through Qualcomm/Broadcom engineers.</li></ul>`}
resumes();

function plan(){$("plan").innerHTML=`<p class="note">A sustainable cadence beats a burst. Aim for 2–4 quality applications a week rather than 20 rushed ones.</p><table>${PLAN.map(([d,t])=>`<tr><td><b>${d}</b></td><td>${esc(t)}</td></tr>`).join("")}</table>
<h3>Search tips for your profile</h3><ul><li>Company-direct searches beat aggregators: try "Wi-Fi validation", "wireless test", "customer engineering", "field applications", "escalation" + each target company.</li><li>Also consider adjacent employers outside the 12 (Ubiquiti, Ruckus/CommScope, Arista/Juniper Mist, Aruba/HPE, Plume, Meraki, Garmin, Sonos, Roku, Intel/Wi-Fi, Synaptics) — many hire exactly your profile with less competition.</li><li>LinkedIn: set alerts on "Wi-Fi" + "validation|escalation|FAE" within 25 miles of Brentwood plus Remote.</li></ul>`}
plan();

function tools(){const w=S.w;$("tools").innerHTML=`<h3>Scoring weights</h3><p class="note">Change what matters to you (e.g., raise Location if you won't relocate). Scores update everywhere.</p>${Object.keys(w).map(k=>`<div class="slider"><span>${FACLAB[k]}</span><input type="range" min="0" max="50" value="${w[k]}" oninput="S.w['${k}']=+this.value;this.nextElementSibling.textContent=this.value;save();render()"><b>${w[k]}</b></div>`).join("")}<button onclick="S.w={...WEIGHTS0};save();tools();render()">Reset weights</button>
<h3>Backup / sync</h3><p class="note">Progress lives in this browser. Export to move it between devices.</p><button onclick="exp()">Export progress (JSON)</button> <label class="btn" style="cursor:pointer">Import<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label> <button onclick="print()">Print / save PDF</button> <button onclick="if(confirm('Erase saved progress?')){localStorage.removeItem(KEY);location.reload()}">Reset all</button>
<h3>Updating the data</h3><p class="note">Edit the <code>ROLES</code> array at the top of the script in index.html (or ask Claude to refresh it from the weekly report), commit, and the site updates.</p>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="job-progress.json";a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{S=JSON.parse(r.result);save();location.reload()};r.readAsText(f)}

loadFeed();render();show((location.hash||"#roles").slice(1)||"roles");
</script>
</body>
</html>
